services:
  # Backend API Service
  - type: web
    name: aiva-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ANTHROPIC_API_KEY
        sync: false  # REQUIRED: Set this in Render dashboard (see RENDER_EXACT_STEPS.md)
      - key: OPENAI_API_KEY
        sync: false  # REQUIRED: Set this in Render dashboard (see RENDER_EXACT_STEPS.md)
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false  # Set after frontend is deployed

